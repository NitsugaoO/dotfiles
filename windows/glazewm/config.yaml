# ============================================================
#  GlazeWM 配置 — 精简版
#  修改后按 Alt+Shift+R 即可热重载,无需重启
# ============================================================

animations:
  # 窗口纯位移（位置变化）—— 保留
  window_move:
    enabled: true
    duration_ms: 150
    easing: "cubic_bezier(0.2, 0.0, 0.0, 1.0)"
    threshold_px: 10
  # 尺寸变化 —— 关闭。注意：布局重排（插入/关闭/移动跨 split）常同时改变位置和尺寸，
  # 只开 window_move 会出现“位移渐变、尺寸瞬变”的撞裂感；若看到就改回 true
  window_resize:
    enabled: false
    duration_ms: 150
    easing: "cubic_bezier(0.2, 0.0, 0.0, 1.0)"
    threshold_px: 10
  # 新窗口出现 —— 关闭
  window_open:
    enabled: false
    duration_ms: 150
    easing: "cubic_bezier(0.16, 1.0, 0.3, 1.0)"
    style: "slide_right"
    opacity_from: 1.0
  # 切工作区滑动（Feeling 主打的连续动画）；225ms = 官方建议值 450 的一半
  workspace_switch:
    enabled: true
    duration_ms: 225
    easing: "ease_in_out"
    style: "slide"
    direction: "horizontal"
    iris_origin: "center"
    opacity_outgoing: 1.0
    opacity_incoming: 1.0
    zoom_factor: 0.0
  # 窗口关闭 —— 关闭
  window_close:
    enabled: false
    duration_ms: 150
    easing: "ease_in_cubic"
    style: "none"
    opacity_to: 0.0
  # 桌面显隐（键位 alt+shift+m 见 keybindings）—— 动画关闭
  desktop_toggle:
    enabled: false
    hide_duration_ms: 220
    show_duration_ms: 260
    easing: "ease_in_out"
    hidden_scale: 0.94
    offset_x: 0
    offset_y: 24
    hidden_opacity: 0.0


general:
  # YASB 状态栏随 GlazeWM 启动
  startup_commands: ['shell-exec yasb']
  shutdown_commands: []
  config_reload_commands: []

  # 鼠标移到窗口上自动聚焦(喜欢点哪聚焦哪可设为 true)
  focus_follows_cursor: false

  # 再次按当前 workspace 快捷键时,回到上一个 workspace
  toggle_workspace_on_refocus: false

  cursor_jump:
    # 切换焦点时自动把鼠标移到新窗口中心
    enabled: true
    # trigger: 'monitor_focus' | 'window_focus'
    trigger: 'monitor_focus'

  # 切换 workspace 时如何隐藏窗口:cloak 是 Win 推荐项
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  # 紧凑布局
  scale_with_dpi: true
  inner_gap: '8px'   # 相邻窗口间距
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  # 焦点描边:Feeling 自绘的点击穿透描边,单位=物理像素。
  # 0/1 = 只用系统原生细边框(当前观感);>1 才会额外叠一层自绘描边
  focused_border_width: 0
  # 进入 resize 模式(alt+r)时把描边加粗到这个宽度,退出立即恢复
  resize_border_width: 6
  # 聚焦窗口:Everforest 鼠尾草绿边框
  focused_window:
    border:
      enabled: true
      color: '#a7c080'
    hide_title_bar:
      # 试过开启（2026-10-28）：看不出区别，已回退。
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: true
      opacity: '100%'

  # 非聚焦窗口:Everforest 边框灰(bg/border)
  other_windows:
    border:
      enabled: true
      color: '#414b50'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      # 关闭透明：非聚焦窗口保持不透明（原来 opacity: 90%）
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'   # 新窗口默认平铺
  state_defaults:
    floating:
      centered: true        # 浮动窗口默认居中
      shown_on_top: false
    fullscreen:
      # true = 走 Windows 原生最大化（会避开 YASB 的 AppBar）；
      # false = GlazeWM 自研全屏，会覆盖整个显示器连状态栏一起吃掉
      maximized: true
      shown_on_top: false

workspaces:
  # name 决定 yasb 状态栏上 Workspaces 组件的从左到右顺序：yasb 按 name 的自然序排序，
  # 这里的声明顺序完全不参与，所以用数字当 name、显示名放 display_name。
  # 改名后 keybindings 里的 focus/move --workspace 参数必须一起改。
  - name: '1'
    display_name: 'all'
  - name: '2'
    display_name: 'web'
  - name: '3'
    display_name: 'dev'
  - name: '4'
    display_name: 'game'

window_rules:
  # YASB 状态栏不参与平铺
  - commands: ['ignore']
    match:
      - window_process: { equals: 'yasb' }

  # tupa-launcher 面板：自动浮动 + 居中 + 固定尺寸，不参与平铺
  # 位置和大小交给 GlazeWM 管（而不是面板自己 SetWindowPos），这样
  # 它和你其他浮动窗口的布局规则保持一致。
  # 注意命令顺序：size 会改变窗口尺寸，所以必须在 size 之后再 position --centered，
  # 否则居中是按“改尺寸前”的大小算的，会偏。
  #
  # 1) 自绘窗口（`tupa-launcher.exe --gui`）：进程名 + winit 窗口类名
  - commands: ['set-floating', 'size --width 62% --height 55%', 'position --centered']
    match:
      - window_process: { equals: 'tupa-launcher' }
        window_class: { equals: 'TupaLauncherWindow' }

  # 2) 旧版 TUI 面板（Windows Terminal 里的标签页）
  # 窗口类是 Windows Terminal 的，再用标题前缀锁定面板，避免影响普通终端窗口。
  # 只认 "tupa-launcher" 本身或带 " - " / ": " 后缀的标题；pi 在项目目录里工作时
  # 标题是 "π - tupa-launcher"，不能误判。
  - commands: ['set-floating', 'size --width 62% --height 55%', 'position --centered']
    match:
      - window_class: { equals: 'CASCADIA_HOSTING_WINDOW_CLASS' }
        window_title: { regex: '^tupa-launcher($| - |: )' }

  - commands: ['ignore']
    match:
      # 画中画窗口不参与平铺
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # 常用弹窗类程序忽略平铺
      - window_process: { equals: 'PowerToys' }
      - window_process: { equals: 'Lively' }

  # QQ 完全不管:不参与平铺,也无需 GlazeWM 定位,交给 Windows 原生管理
  - commands: ['ignore']
    match:
      - window_process: { equals: 'QQ' }

  # Clash Party 主窗口完全不管,交给 Windows 原生管理
  - commands: ['ignore']
    match:
      - window_process: { equals: 'Clash Party' }

  # Plain Craft Launcher 2 启动器完全不管,交给 Windows 原生管理
  - commands: ['ignore']
    match:
      - window_process: { equals: 'Plain Craft Launcher 2' }

  # Sakura Frp 启动器(SakuraLauncher)完全不管,交给 Windows 原生管理
  - commands: ['ignore']
    match:
      - window_process: { equals: 'SakuraLauncher' }

  # WebSocket Reflector X(wsrx-desktop)自动浮动,不参与平铺
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'wsrx-desktop' }

  # HiBit Uninstaller 自动浮动,不参与平铺
  # 用的是便携版,所以进程名是 'HiBitUninstaller-Portable' 而非 'HiBitUninstaller'
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'HiBitUninstaller-Portable' }

  # 文件资源管理器自动浮动(居中显示)
  # 必须带 window_class 限定:explorer.exe 还持有桌面(Progman/WorkerW)、
  # 任务栏(Shell_TrayWnd)、托盘等 shell 窗口,只按进程名匹配会连它们一起命中。
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'explorer' }
        window_class: { regex: 'CabinetWClass|ExploreWClass' }

  # NanaZip 自动浮动,不参与平铺
  # 实测(MSIX 版 5.x)进程名是 'NanaZip.Modern.FileManager'(窗口类名同名),
  # 旧版 7-Zip 界面风格的进程名是 'NanaZip' —— 用前缀匹配同时覆盖二者。
  - commands: ['set-floating']
    match:
      - window_process: { regex: '^NanaZip' }

  # IDA 主窗口平铺,弹窗自动浮动
  # 不能按进程名整体浮动:IDA 是 Qt 应用,弹窗(QDialog)与主窗口的进程名、窗口类名
  # 完全相同(实测 IDA Free 9.4 都是 ida / Qt682QTQWindowIcon),而 GlazeWM 的
  # window_rules 只有 window_process / window_class / window_title 三个匹配维度,
  # 没有「这是不是对话框」的判定,所以只能靠标题把主窗口摘出去:
  #   主窗口标题形如 'IDA - <文件> - Only for non-commercial use'(未打开文件时是 'IDA: Quick start'),
  #   弹窗标题则是各色 UI 词汇(Add breakpoint / Rename / Warning …)。
  #   '^IDA\b' 能同时盖住 'IDA' / 'IDA - …' / 'IDA: Quick start'(实测 IDA Free 9.4)。
  # 注意:GlazeWM 的 not_regex 是「不匹配才命中」,规则在窗口创建时执行一次,
  # 所以主窗口后来改标题(打开/另存文件)不会被重新判成弹窗。
  # 若某弹窗确实以 'IDA' 开头被漏掉,把这条改成只按 window_process 匹配即可(整体浮动)。
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'ida' }
        window_title: { not_regex: '^IDA\b' }

  # Windows 计算器自动浮动,不参与平铺
  # 注意:计算器是 UWP 应用(进程 CalculatorApp.exe),但它的顶层窗口由
  # ApplicationFrameHost.exe 寄主(窗口类 ApplicationFrameWindow) —— 按进程名匹配
  # 会连设置/照片/商店等所有 UWP 窗口一起浮动,只能用标题锁定。
  # 标题随系统语言变化,中英两版都写上(实测中文版窗口标题就是 '计算器')。
  - commands: ['set-floating']
    match:
      - window_class: { equals: 'ApplicationFrameWindow' }
        window_title: { regex: '^(计算器|Calculator)$' }

  # Windhawk 界面完全不管,交给 Windows 原生管理
  # 注意:Windhawk 的图形界面是定制版 VSCodium(位于 C:\Program Files\Windhawk\UI\VSCodium.exe),
  # 所以窗口进程名是 'VSCodium' 而非 'windhawk';windhawk.exe 只是托盘/守护进程,
  # 它自己只有隐藏窗口 'WindhawkDaemon',不持有任何可见窗口。
  - commands: ['ignore']
    match:
      - window_process: { equals: 'VSCodium' }

binding_modes:
  # 按 Alt+R 进入 resize 模式:方向键/HJKL 调大小,Esc 退出
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # ---- 焦点移动(纯 HJKL)----
  # 不绑 alt+方向键 / alt+shift+方向键：GlazeWM 走全局键盘钩子，匹配到就吞键，
  # 没有「程序没处理才轮到 WM」的 fallback，所以只能解绑，把这几组键还给程序
  # （浏览器 alt+←/→ 前进后退、编辑器按词移动等）。resize 模式里的裸方向键
  # 只在 Alt+R 激活时生效，不占组合键，保留。
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction right']
    bindings: ['alt+l']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction down']
    bindings: ['alt+j']

  # ---- 窗口移动(纯 HJKL)----
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']

  # ---- 调整窗口大小 ----
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']

  # 进入 resize 模式(方向键/HJKL)
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # ---- 窗口状态切换 ----
  - commands: ['toggle-floating --centered']   # 浮动/平铺
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']             # 全屏
    bindings: ['alt+f']
  - commands: ['toggle-minimized']              # 最小化
    bindings: ['alt+m']
  # 显示桌面 / 还原：cloak 隐藏当前 workspace 的可见窗口，不动窗口树、不改原生位置。
  # 命令来自本 fork（Feeling 基线自带），原版 GlazeWM 没有。
  - commands: ['wm-toggle-desktop']
    bindings: ['alt+shift+m']
  - commands: ['toggle-tiling-direction']       # 切换平铺方向
    bindings: ['alt+shift+v']
  - commands: ['wm-cycle-focus']                # 平铺→浮动→全屏循环
    bindings: ['alt+space']
  - commands: ['close']                         # 关闭窗口
    bindings: ['alt+shift+q']

  # ---- WM 控制 ----
  - commands: ['wm-reload-config']              # 重载配置
    bindings: ['alt+shift+r']
  - commands: ['wm-toggle-pause']               # 暂停/恢复 WM
    bindings: ['alt+shift+p']
  - commands: ['wm-exit']                       # 退出 GlazeWM
    bindings: ['alt+shift+e']

  # ---- 启动程序 ----
  - commands: ['shell-exec wt']                 # Windows Terminal
    bindings: ['alt+enter']

  # ---- workspace 切换 ----
  # win+←/→ 接管原生 Aero Snap：原生 WM 已关，这两个组合本来无用，改成左右切
  # workspace（--next/--prev-active 会跳过没有窗口的 workspace，与 alt+s/a 同语义）。
  # 钩子只吞 right/left、不吞 LWin 本身，存在「被系统判成单击 Win 弹开始菜单」的
  # 理论风险；2026-11-05 实测：切工作区正常、无开始菜单弹出，故保留这两条。
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s', 'win+right']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a', 'win+left']
  # alt+d 被 fork 的 swap 选择器占用，recent-workspace 挪到 alt+w（与 s/a 同组）
  - commands: ['focus --recent-workspace']
    bindings: ['alt+w']
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']

  # ---- 窗口交换：Alt-Tab 式选择器（OhMyGlazeWM 内核命令）----
  # **接管了系统 Alt+Tab**（实测：GlazeWM 的 LL 钩子把 Alt+Tab 完全吞掉，前台不变）。
  # 按住 alt 连按 tab 在最小化窗口间移动，松开 alt 提交一次原子交换，Esc 取消。
  # 只占 alt+tab / alt+shift+tab，不设备用键。
  # 命令来自本 fork，原版 GlazeWM 没有。
  # 布局默认是网格缩略图；想要「icon + 标题列表 + 右侧大缩略图」加 `--layout list`。
  - commands: ['swap-switcher']
    bindings: ['alt+tab']
  - commands: ['swap-switcher --reverse']
    bindings: ['alt+shift+tab']

  # ---- 把最小化窗口叫到前台（同一个选择器，不交换）----
  # commit 时只做 restore + 聚焦：当前窗口原地不动，被叫出来的窗口按
  # alt+t 同款规则入树（有有效原位就回原位，否则靠当前聚焦平铺窗口）。
  # 按住 alt+ctrl 连按 tab 选，松 alt 提交，Esc 取消。
  - commands: ['swap-switcher --bring-to-front']
    bindings: ['alt+ctrl+tab']
  - commands: ['swap-switcher --bring-to-front --reverse']
    bindings: ['alt+ctrl+shift+tab']

  # ---- 窗口移动到 workspace ----
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']

  # ---- 窗口移动到 workspace,但人留在当前 workspace ----
  # 只有 move,不带 focus。窗口移过去会立刻被 cloak,屏幕上看不到反馈,
  # 用 alt+数字 切过去才能确认(状态栏该 workspace 的窗口数会 +1)。
  # 目标就是当前 workspace 时是 no-op。
  - commands: ['move --workspace 1']
    bindings: ['alt+ctrl+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+ctrl+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+ctrl+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+ctrl+4']
