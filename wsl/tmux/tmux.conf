# tmux.conf —— dojo 与 WSL 共用同一份
# 部署位置：dojo  ~/.tmux.conf      （本仓库 my_pwn/env/tmux.conf）
#           WSL   ~/.tmux.conf      （my_dot/dotfiles/wsl/tmux/tmux.conf，需保持内容一致）
# 校验：sha256sum / ssh dojo 'sha256sum ~/.tmux.conf'

# ---------- 交互 ----------
# 鼠标：滚轮滚动（自动进 copy-mode）、点选窗格、拖边框改大小
set -g mouse on

# Esc 立即生效，默认 500ms 延迟在 vim 里非常难受
set -g escape-time 10

# copy-mode 保持默认的 emacs 风格（方向键/PgUp 都能滚，不用改）
# 想换成 vi 键位时再取消下一行注释
#setw -g mode-keys vi

# ---------- 编号 ----------
# 窗口和窗格从 1 开始，键盘上 1 比 0 顺手
set -g base-index 1
setw -g pane-base-index 1

# ---------- 历史 ----------
# 默认只存 2000 行，disasm / traceback 一刷就没了，调大
set -g history-limit 50000

# ---------- 分割 ----------
# 新窗格继承当前目录（需要 tmux >= 3.0，老版本把 -c 那段删掉）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---------- 杂项 ----------
set -g default-terminal "screen-256color"
set -g focus-events on
# 允许 tmux 通过 OSC52 写系统剪贴板（部分终端/ssh 环境不支持，报错就注释掉）
set -g set-clipboard on
